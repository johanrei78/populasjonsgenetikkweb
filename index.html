<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Populasjonsgenetikk-simulator</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Populasjonsgenetikk-simulator</h1>

        <nav aria-label="Hovednavigasjon">
            <button id="nav-innstillinger" type="button">
                Innstillinger
            </button>

            <button id="nav-resultater" type="button">
                Resultater
            </button>
        </nav>
    </header>

    <main>

        <!-- INNSTILLINGER -->
        <section id="innstillinger" class="side">
            <h2>Oppsett og evolusjonsmekanismer</h2>

            <p>
                Her skal innstillingene for simuleringen komme.
            </p>
        </section>


        <!-- RESULTATER -->
        <section id="resultater" class="side" hidden>
            <h2>Resultater</h2>

            <p>
                Her skal resultatene fra simuleringen komme.
            </p>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
