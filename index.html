<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Populasjonsgenetikk-simulator</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Populasjonsgenetikk-simulator</h1>

        <nav aria-label="Hovednavigasjon">
            <button id="nav-innstillinger" type="button">
                Innstillinger
            </button>

            <button id="nav-resultater" type="button">
                Resultater
            </button>
        </nav>
    </header>

    <main>

        <!-- INNSTILLINGER -->
        <section id="innstillinger" class="side">

            <h2>Oppsett og evolusjonsmekanismer</h2>

            <fieldset class="innstillingsgruppe">
                <legend>Tid</legend>

                <label for="generations">
                    Antall generasjoner
                    <strong id="generations-value">100</strong>
                </label>

                <input
                    type="range"
                    id="generations"
                    min="10"
                    max="500"
                    step="1"
                    value="100"
                >
            </fieldset>


            <fieldset class="innstillingsgruppe">
                <legend>Antall populasjoner</legend>

                <label>
                    <input
                        type="radio"
                        name="num-pops"
                        value="1"
                        checked
                    >
                    1
                </label>

                <label>
                    <input
                        type="radio"
                        name="num-pops"
                        value="2"
                    >
                    2
                </label>
            </fieldset>


            <fieldset class="innstillingsgruppe">
                <legend>Startfrekvens A₁</legend>

                <!-- Én populasjon -->
                <div id="startfrekvens-en-pop">

                    <label for="p0">
                        Allelfrekvens A₁
                    </label>

                    <input
                        type="number"
                        id="p0"
                        min="0"
                        max="1"
                        step="0.001"
                        value="0.5"
                    >

                </div>


                <!-- To populasjoner -->
                <div id="startfrekvens-to-pop" hidden>

                    <div>
                        <label for="p0-1">
                            Populasjon 1
                        </label>

                        <input
                            type="number"
                            id="p0-1"
                            min="0"
                            max="1"
                            step="0.001"
                            value="0.5"
                        >
                    </div>

                    <div>
                        <label for="p0-2">
                            Populasjon 2
                        </label>

                        <input
                            type="number"
                            id="p0-2"
                            min="0"
                            max="1"
                            step="0.001"
                            value="0.5"
                        >
                    </div>

                </div>

            </fieldset>

        </section>


        <!-- RESULTATER -->
        <section id="resultater" class="side" hidden>

            <h2>Resultater</h2>

            <p>
                Her skal resultatene fra simuleringen komme.
            </p>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
